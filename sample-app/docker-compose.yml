version: "3.8"
services:
  frontend:
    image: ${DOCKERHUB_USER}/blog-frontend:latest
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

  backend:
    image: ${DOCKERHUB_USER}/blog-backend:latest
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=bloguser
      - DB_PASSWORD=blogpass
      - DB_NAME=blogdb
    restart: always
